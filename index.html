<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToolBox · Free online tools for drawing, writing, files & more</title>
  <meta name="description" content="A growing collection of free tools that run right in your browser. No sign-ups, no ads, no uploads — everything stays on your device.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛠️%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=14">
  <link rel="stylesheet" href="css/tailwind.css?v=1">
  <style>
    /* ===== intro overlay ===== */
    body.intro-lock { overflow: hidden; }
    #intro-overlay {
      position: fixed; inset: 0; z-index: 9999; background: #0a0e15;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      opacity: 1; transition: opacity .8s ease;
    }
    #intro-overlay.hide { opacity: 0; pointer-events: none; }
    #intro-overlay.gone { display: none; }
    #intro-video { width: 100%; height: 100%; object-fit: cover; }
    .intro-vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(4,7,12,.88) 100%);
    }
    .intro-brand {
      position: absolute; left: 18px; bottom: 16px; color: #d3dcea; font-size: .8rem;
      font-weight: 700; letter-spacing: .06em; opacity: .85; pointer-events: none;
      text-shadow: 0 1px 8px rgba(0,0,0,.6);
    }
    .intro-actions { position: absolute; right: 18px; bottom: 16px; display: flex; gap: 8px; }
    #intro-skip {
      background: rgba(13,18,28,.55); border: 1px solid rgba(139,92,246,.45); color: #e8eef7;
      font-size: .74rem; font-weight: 600; padding: 8px 16px; border-radius: 999px;
      cursor: pointer; backdrop-filter: blur(6px); transition: all .25s ease;
    }
    #intro-skip:hover { background: rgba(139,92,246,.35); border-color: #8b5cf6; }
  </style>
</head>
<body>
  <div id="intro-overlay" aria-hidden="true">
    <video id="intro-video" src="assets/intro.mp4" autoplay playsinline preload="auto" onerror="window.__introDismiss&&window.__introDismiss()"></video>
    <div class="intro-vignette"></div>
    <span class="intro-brand">🛠️ ToolBox</span>
    <div class="intro-actions">
      <button id="intro-skip" type="button" onclick="window.__introDismiss&&window.__introDismiss()">Skip intro ⏭</button>
    </div>
  </div>
  <script>
    /* fail-safe dismiss — defined first so skip/error always work, even if the main script fails */
    window.__introMark = function () {
      try { sessionStorage.setItem('tb-intro-done', '1'); } catch (e) {}
    };
    window.__introSeen = function () {
      try { return !!sessionStorage.getItem('tb-intro-done'); } catch (e) { return false; }
    };
    window.__introDismiss = function () {
      var o = document.getElementById('intro-overlay');
      if (!o || o.dataset.done) return;
      o.dataset.done = '1';
      o.classList.add('hide');
      document.body.classList.remove('intro-lock');
      /* cut the audio: pause the video immediately instead of letting it play behind the fade */
      var v = document.getElementById('intro-video');
      if (v) v.pause();
      window.__introMark();
      setTimeout(function () { o.classList.add('gone'); }, 900);
    };
  </script>
  <header id="site-header" class="sticky top-0 z-50 border-b border-day-200/70 bg-day-50/80 backdrop-blur-md transition-colors duration-300 dark:border-night-600/60 dark:bg-night-950/80"></header>
  <main id="page" data-route="home"></main>
  <footer id="site-footer"></footer>
  <script src="js/site.js?v=27"></script>
  <script>
    /* ===== intro playback ===== */
    (function () {
      var ov = document.getElementById('intro-overlay');
      if (!ov) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function finish() {
        if (ov.dataset.done) return;
        ov.dataset.done = '1';
        ov.classList.add('hide');
        document.body.classList.remove('intro-lock');
        /* cut the audio: pause the video immediately instead of letting it play behind the fade */
        var v = document.getElementById('intro-video');
        if (v) v.pause();
        window.__introMark();
        setTimeout(function () { ov.classList.add('gone'); }, 900);
      }
      /* replayable from the footer button (defined before any early exit) */
      window.replayIntro = function () {
        ov.classList.remove('gone', 'hide');
        ov.dataset.done = '';
        document.body.classList.add('intro-lock');
        var v = document.getElementById('intro-video');
        /* force a clean reload — handles the case where the element is stuck in an error state */
        v.src = 'assets/intro.mp4';
        v.load();
        v.currentTime = 0;
        /* replay is a user gesture, so sound is always allowed */
        v.muted = false;
        var p = v.play();
        if (p && p.catch) p.catch(function () {
          /* safety: if playback is refused, retry muted once */
          v.muted = true;
          var p2 = v.play();
          if (p2 && p2.catch) p2.catch(function () {});
        });
      };

      /* seen once this session? skip straight past the intro (pressing Home shouldn't replay it) */
      if (window.__introSeen && window.__introSeen()) {
        ov.classList.add('gone');
        document.body.classList.remove('intro-lock');
        var sv = document.getElementById('intro-video');
        if (sv) { sv.pause(); sv.removeAttribute('src'); sv.load(); }
        return;
      }

      if (reduce) {
        ov.classList.add('gone');
        /* don't keep the hidden video playing in the background */
        var sv = document.getElementById('intro-video');
        if (sv) { sv.pause(); sv.removeAttribute('src'); sv.load(); }
        return;
      }
      document.body.classList.add('intro-lock');
      var v = document.getElementById('intro-video');
      /* the intro always plays with audio — the browser only allows that once the user has interacted
         with the site, so on a truly fresh profile it may fall back to muted via the retry below */
      v.muted = false;
      var started = false;
      function markStarted() { started = true; }
      v.addEventListener('playing', markStarted);
      v.addEventListener('timeupdate', markStarted); /* backup: fires once playback is actually advancing */
      v.addEventListener('ended', finish);
      v.addEventListener('error', function () { finish(); });
      function tryPlay(mutedRetry) {
        var p = v.play();
        if (p && p.catch) p.catch(function () {
          /* autoplay blocked — usually because sound was requested before any interaction on this browser.
             Retry muted once; only give up if even muted playback is refused. */
          if (!mutedRetry) {
            v.muted = true;
            tryPlay(true);
          } else {
            finish();
          }
        });
      }
      tryPlay(false);
      /* safety nets: never leave the site stuck behind a dead video */
      setTimeout(function () { if (!started && v.currentTime <= 0 && v.readyState < 3) finish(); }, 3500);
      setTimeout(function () { if (!ov.dataset.done) finish(); }, 15000); /* hard cap, video is 10s */
      document.getElementById('intro-skip').addEventListener('click', finish);
    })();
  </script>
</body>
</html>
